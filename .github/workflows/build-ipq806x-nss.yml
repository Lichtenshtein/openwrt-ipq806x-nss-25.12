name: Build ipq806x NSS images

on:
  # push:
    # branches:
      # - 'ipq806x-nss-*'
      # - 'dsa-main'
    # tags:
      # - 'v*'
    # paths-ignore:
      # - 'README.md'
      # - 'README.openwrt.md'
  workflow_dispatch:
    inputs:
      ssh:
        description: 'Launch tmate (SSH) for make menuconfig'
        type: boolean
        default: false
      freeSpace:
        description: 'Free some Disk Space before Build'
        type: boolean
        default: false
      uploadPackages:
        description: 'Upload module packages (.ipk/.apk) as artifact'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.device }} (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    continue-on-error: ${{ matrix.experimental }}
    env:
      CCACHE_MAXSIZE: 2G
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: askey_rt4230w-rev6
            variant: std
            seed: diff-rac2v1k
            experimental: false

    steps:
      - name: Check Initial Disk Space
        id: space_check
        run: |
          echo "=== Initial Disk Space ==="
          df -h /

          # Get the available space in megabytes
          AVAILABLE_SPACE=$(df -m / | awk 'NR==2 {print $4}')
          echo "available_space_mb=$AVAILABLE_SPACE" >> $GITHUB_OUTPUT

          # If the space is less than 35840 MB (35 GB), raise the panic flag
          if [ "$AVAILABLE_SPACE" -lt 35840 ]; then
            echo "🚨 Low disk space detected! Forcing auto-clean."
            echo "trigger_clean=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Disk space is sufficient."
            echo "trigger_clean=false" >> $GITHUB_OUTPUT
          fi

      ## This cleans ~24Gb
      - name: Free Disk Space (Ubuntu)
        if: ${{ github.event.inputs.freeSpace == 'true' || steps.space_check.outputs.trigger_clean == 'true' }}
        uses: aausch/free-disk-space@fix/input-injection-and-mode-guard
        with:
          tool-cache: false
          mandb:   true
          android: true
          dotnet: true
          haskell: true
          large-packages: true # clang or llvm-ar on host
          docker-images: false
          swap-storage: false
          codeql-images: true # GitHub vulnerability scanner CodeQ

      # This cleans ~400Mb
      - name: Final Deep Clean and Space Check
        if: ${{ github.event.inputs.freeSpace == 'true' || steps.space_check.outputs.trigger_clean == 'true' }}
        run: |
          sudo ionice -c 3 rm -rf /usr/share/dotnet &
          sudo ionice -c 3 rm -rf /usr/local/lib/android &
          sudo ionice -c 3 rm -rf /opt/ghc &
          sudo ionice -c 3 rm -rf "/usr/local/share/boost" &
          sudo ionice -c 3 rm -rf "$AGENT_TOOLSDIRECTORY" &
          docker image prune -af &
          wait
          echo "--- FINAL DISK SPACE REPORT ---"
          df -h /
          echo "-------------------------------"

      - name: Setup Swap Space
        run: |
          CURRENT_SPACE=$(df -m / | awk 'NR==2 {print $4}')
          echo "Current space after potential clean: $CURRENT_SPACE MB"

          # If space is critically low (less than 30 GB / 30720 MB)
          if [ "$CURRENT_SPACE" -lt 30720 ]; then
            echo "⚠️ Post-clean disk space is critically tight ($CURRENT_SPACE MB)."
            sudo swapoff -a || true
            sudo rm -f /swapfile
            echo "=== Allocating safe 2GB Swap File to preserve disk cache ==="
            sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048

          # If space is moderately low (less than 55 GB / 56320 MB)
          elif [ "$CURRENT_SPACE" -lt 56320 ]; then
            echo "ℹ️ Moderate disk space available ($CURRENT_SPACE MB). 32GB Swap is dangerous."
            sudo swapoff -a || true
            sudo rm -f /swapfile
            echo "=== Allocating balanced 6GB Swap File ==="
            sudo fallocate -l 6G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=6144

          # If there is really a lot of space (more than 55 GB)
          else
            echo "✅ Abundant disk space available ($CURRENT_SPACE MB). Safe for maximum swap."
            sudo swapoff -a || true
            sudo rm -f /swapfile
            echo "=== Allocating maximum 16GB Swap File ==="
            sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
          fi

          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          swapon --show

          echo "=== Remaining Disk Space after Swap Allocation ==="
          df -h /


      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev rsync swig unzip zlib1g-dev file \
            wget zstd

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # actions/cache only saves when the whole job succeeds, so a failed build
      # lost everything. Restore here, save below with "if: always()".
      - name: Restore downloads cache
        id: dl-cache
        uses: actions/cache/restore@v5
        with:
          path: dl
          key: dl-${{ matrix.device }}-${{ hashFiles('feeds.conf.default', matrix.seed) }}
          restore-keys: dl-${{ matrix.device }}-

      # OpenWrt keeps the ccache in ./.ccache when CONFIG_CCACHE_DIR is empty.
      - name: Restore compiler cache (ccache)
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ccache-${{ matrix.device }}-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.device }}-${{ matrix.variant }}-

      - name: Update feeds
        run: |
          git clone --depth 1 --branch master --no-tags --recurse-submodules https://github.com/fantastic-packages/packages.git fantastic_packages
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          unzip -o VHTNSS.zip

          # Selectively pull only the necessary packages from ImmortalWrt
          # For multiple packages, separate by spaces: `git sparse-checkout set net/hysteria net/another_package`
          # git clone --depth 1 --filter=blob:none --sparse https://github.com/immortalwrt/packages.git /tmp/immortal
          # cd /tmp/immortal
          # git sparse-checkout set net/hysteria
          # cp -r net/hysteria $GITHUB_WORKSPACE/package/
          # cd $GITHUB_WORKSPACE
          # rm -rf /tmp/immortal

      - name: Configure
        run: |
          cp ${{ matrix.seed }} .config
          # ccache is enabled for CI only, so local builds of the seed are unaffected
          echo 'CONFIG_CCACHE=y' >> .config
          make defconfig

      # - name: Setup tmate session
        # if: ${{ github.event.inputs.ssh == 'true' }}
        # uses: mxschmitt/action-tmate@v3
        # timeout-minutes: 30

      - name: Setup upterm session
        if: ${{ github.event.inputs.ssh == 'true' }}
        uses: owenthereal/action-upterm@v1
        timeout-minutes: 30

      # Warn about seed lines that "make defconfig" silently dropped (renamed or
      # removed packages, unmet dependencies). Checked before the long build.
      - name: Check seed survived defconfig
        run: |
          grep '^CONFIG_' "${{ matrix.seed }}" | sed 's/[[:space:]]*$//' > seed.lines
          : > dropped.txt
          while IFS= read -r line; do
            grep -qxF -- "$line" .config || echo "$line" >> dropped.txt
          done < seed.lines
          if [ -s dropped.txt ]; then
            while IFS= read -r line; do
              echo "::warning::dropped by defconfig: $line"
            done < dropped.txt
            {
              echo "### Seed lines dropped by defconfig (${{ matrix.variant }})"
              echo '```'
              cat dropped.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "All seed lines survived defconfig."
          fi
          rm -f seed.lines dropped.txt

      - name: Download sources
        run: make -j8 download

      - name: Build
        run: |
          make -j$(nproc) || {
            echo "::warning::parallel build failed, rerunning with -j1 V=s"
            make -j1 V=s 2>&1 | tail -n 300
            exit 1
          }

      # These run even when the build failed, so the next attempt starts warm.
      - name: Save downloads cache
        if: always() && steps.dl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: dl
          key: dl-${{ matrix.device }}-${{ hashFiles('feeds.conf.default', matrix.seed) }}

      # On a cancelled run make/ccache are still writing to .ccache when the save
      # step starts, so tar fails with "file changed as we read it" and the cache
      # is lost. Stop make and wait (up to 60 s) for running ccache jobs to finish.
      - name: Stop leftover build processes
        if: always()
        run: |
          pkill -TERM -x make || true
          for i in $(seq 1 30); do
            pgrep -x ccache >/dev/null || break
            sleep 2
          done

      - name: Save compiler cache (ccache)
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ccache-${{ matrix.device }}-${{ matrix.variant }}-${{ github.sha }}

      - name: Collect images
        run: |
          mkdir -p out
          cp bin/targets/ipq806x/generic/openwrt-nss-*-${{ matrix.device }}-* out/
          cp bin/targets/ipq806x/generic/openwrt-nss-*-${{ matrix.device }}.manifest out/
          # Variants other than "std" get their name in the file names so releases never collide.
          if [ "${{ matrix.variant }}" != "std" ]; then
            for f in out/*; do
              mv "$f" "out/$(basename "$f" | sed 's/^openwrt-nss-/openwrt-nss-${{ matrix.variant }}-/')"
            done
          fi
          (cd out && sha256sum * > sha256sums-${{ matrix.device }}-${{ matrix.variant }})
          ls -la out

      - name: Upload images
        uses: actions/upload-artifact@v6
        with:
          name: openwrt-nss-${{ matrix.device }}-${{ matrix.variant }}
          path: out/
          retention-days: 30

      - name: Collect module packages
        if: ${{ github.event.inputs.uploadPackages == 'true' }}
        run: |
          mkdir -p out-packages/target-kmods out-packages/feeds-packages
          cp -r bin/targets/ipq806x/generic/packages/* out-packages/target-kmods/ 2>/dev/null || true
          cp -r bin/packages/* out-packages/feeds-packages/ 2>/dev/null || true
          tar -czf packages-${{ matrix.device }}-${{ matrix.variant }}.tar.gz -C out-packages .
          ls -lh packages-${{ matrix.device }}-${{ matrix.variant }}.tar.gz

      - name: Upload module packages
        if: ${{ github.event.inputs.uploadPackages == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: openwrt-nss-packages-${{ matrix.device }}-${{ matrix.variant }}
          path: packages-${{ matrix.device }}-${{ matrix.variant }}.tar.gz
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download images
        uses: actions/download-artifact@v7
        with:
          path: out
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" out/* \
            --repo "${{ github.repository }}" \
            --title "OpenWrt NSS ${{ github.ref_name }}" \
            --notes "Images for the Netgear R7800, built from OpenWrt master. See the README for the test status."
